name: hub-ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Production build (corpus gate + type-checked, standalone copy steps exercised)
        run: bun run build
        env:
          HUB_DATA_MODE: mock

      - name: ADR-021 content package selftest (compile + verify + restore + determinism + tamper)
        run: bash tools/content-package/selftest.sh
