name: hub-ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Production build (corpus gate + type-checked, standalone copy steps exercised)
        run: bun run build
        env:
          HUB_DATA_MODE: mock

      - name: Tutor math normalize verify (T-C44 — the s142 drift shapes render as math, not raw LaTeX)
        run: bun scripts/tutor_math_normalize_verify.ts

      - name: ADR-021 content package selftest (compile + verify + restore + determinism + tamper + KG gate + distribution zip)
        run: bash tools/content-package/selftest.sh

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright chromium
        run: bunx playwright install --with-deps chromium

      - name: Production build (the artifact the specs drive)
        run: bun run build
        env:
          HUB_DATA_MODE: mock

      - name: Deck-flow E2E + axe a11y gate
        run: bunx playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
